name: Release

# 触发：推送 v* 标签时构建三平台安装包并发到 GitHub Release。
# 也可在 Actions 页手动触发（workflow_dispatch）只做构建验证、不发布。
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  # 前置清理：删掉同名 tag 的旧 draft Release，让三平台从干净状态全新上传，
  # 避免重跑时 tauri-action 撞 ReleaseAsset already_exists（它不覆盖同名 asset）。
  cleanup:
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Delete existing draft release for this tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if ! gh release view "${{ github.ref_name }}" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            exit 0
          fi
          if [ "$(gh release view "${{ github.ref_name }}" --repo "${{ github.repository }}" --json isDraft --jq .isDraft)" != "true" ]; then
            echo "::error::同标签已有正式 Release，拒绝删除或覆盖"
            exit 1
          fi
          gh release delete "${{ github.ref_name }}" \
            --repo "${{ github.repository }}" --yes --cleanup-tag=false

  build:
    needs: cleanup
    # cleanup 仅在 tag 触发时跑；手动触发(workflow_dispatch)时 cleanup 被 skip，
    # build 不能因依赖被跳过而连带跳过，故 always() + 放行 skipped。
    if: always() && (needs.cleanup.result == 'success' || needs.cleanup.result == 'skipped')
    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS：Apple Silicon runner，出 universal（x86_64 + aarch64）包。
          - platform: macos-latest
            args: "--target universal-apple-darwin"
            rust-targets: "aarch64-apple-darwin,x86_64-apple-darwin"
          # Windows：MSVC 工具链由 runner 自带。只打 NSIS(.exe)——
          # WiX/MSI 的 light.exe 无法处理中文产品名「鹅的监控」会链接失败，NSIS 不受影响。
          - platform: windows-latest
            args: "--bundles nsis"
            rust-targets: ""
          # Linux：Ubuntu 22.04（webkit2gtk-4.1）。
          - platform: ubuntu-22.04
            args: "--bundles appimage,deb"
            rust-targets: ""

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      # Linux 构建依赖（Tauri 2 需 webkit2gtk-4.1 / rsvg / AppIndicator）。
      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libgtk-3-dev

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}

      - name: Cache Rust
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install bun
        uses: oven-sh/setup-bun@v2

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      - name: Verify version and tests
        env:
          EXPECTED_VERSION: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: |
          bun run check:versions
          bun test
          cargo test --manifest-path src-tauri/Cargo.toml --all-targets --locked

      # tauri-action 会跑 beforeBuildCommand（bun run build:frontend）→ tauri build → 收集产物。
      # 有 tag 时自动建 Release 并上传安装包；手动触发时仅构建。
      - name: Build and release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
          releaseName: ${{ github.ref_type == 'tag' && format('鹅的监控 {0}', github.ref_name) || '' }}
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

  utools:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: Build and verify uTools plugin
        env:
          EXPECTED_VERSION: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: |
          bun run check
          cd utools-dist
          zip -r ../goose-monitor-utools.zip .
      - uses: actions/upload-artifact@v4
        with:
          name: goose-monitor-utools
          path: goose-monitor-utools.zip
      - name: Upload uTools package to draft release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ github.ref_name }}" goose-monitor-utools.zip --clobber --repo "${{ github.repository }}"
