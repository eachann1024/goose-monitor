name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  utools:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: Build and verify uTools plugin
        env:
          EXPECTED_VERSION: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: |
          bun run check
          cd utools-dist
          zip -r ../goose-monitor-utools.zip .
      - uses: actions/upload-artifact@v4
        with:
          name: goose-monitor-utools
          path: goose-monitor-utools.zip
      - name: Upload tagged package to a draft release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${{ github.ref_name }}"
          if gh release view "$tag" >/dev/null 2>&1; then
            if [ "$(gh release view "$tag" --json isDraft --jq .isDraft)" != "true" ]; then
              echo "::error::同版本正式 Release 已存在，拒绝覆盖"
              exit 1
            fi
            if gh release view "$tag" --json assets --jq '.assets[].name' | grep -Fxq 'goose-monitor-utools.zip'; then
              echo "::error::草稿中已存在 goose-monitor-utools.zip，拒绝覆盖"
              exit 1
            fi
          else
            gh release create "$tag" --title "鹅的监控 $tag" --draft
          fi
          gh release upload "$tag" goose-monitor-utools.zip
