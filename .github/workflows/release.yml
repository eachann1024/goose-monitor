name: Release

# 触发：推送 v* 标签时构建三平台安装包并发到 GitHub Release。
# 也可在 Actions 页手动触发（workflow_dispatch）只做构建验证、不发布。
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS：Apple Silicon runner，出 universal（x86_64 + aarch64）包。
          - platform: macos-latest
            args: "--target universal-apple-darwin"
            rust-targets: "aarch64-apple-darwin,x86_64-apple-darwin"
          # Windows：MSVC 工具链由 runner 自带。
          - platform: windows-latest
            args: ""
            rust-targets: ""
          # Linux：Ubuntu 22.04（webkit2gtk-4.1）。
          - platform: ubuntu-22.04
            args: ""
            rust-targets: ""

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      # Linux 构建依赖（Tauri 2 需 webkit2gtk-4.1 / rsvg / AppIndicator）。
      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libgtk-3-dev

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}

      - name: Cache Rust
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install bun
        uses: oven-sh/setup-bun@v2

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      # tauri-action 会跑 beforeBuildCommand（bun run build）→ tauri build → 收集产物。
      # 有 tag 时自动建 Release 并上传安装包；手动触发时仅构建。
      - name: Build and release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
          releaseName: ${{ github.ref_type == 'tag' && format('鹅的监控 {0}', github.ref_name) || '' }}
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
