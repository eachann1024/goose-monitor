[package]
name = "prockill"
version = "0.1.0"
description = "ProcKill — 跨平台进程管理器"
authors = ["ProcKill"]
edition = "2021"
rust-version = "1.88"

[lib]
name = "prockill_lib"
crate-type = ["cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png", "macos-private-api"] }
tauri-plugin-opener = "2"
tauri-plugin-autostart = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sysinfo = "0.38"
kill_tree = { version = "0.2", features = ["blocking"] }
base64 = "0.22"

[profile.release]
panic = "abort"
incremental = true      # release 默认关闭，开启后增量构建有效
codegen-units = 16      # 默认 release 是 1，拉高换并行 codegen（14 核 M4 友好）
lto = "thin"            # thin LTO 比 fat LTO 快很多，体积差距 <5%
opt-level = 2           # 3/"s" → 2，牺牲极少运行性能，编译快不少
strip = true
